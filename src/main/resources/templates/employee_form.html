<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Employee Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">

Employee Form

</h2>

<form th:action="@{/saveEmployee}"
th:object="${employee}"
method="post">

<input type="hidden" th:field="*{id}"/>

<div class="mb-3">

<label>First Name</label>

<input type="text"
class="form-control"
th:field="*{firstName}"
required>

</div>

<div class="mb-3">

<label>Last Name</label>

<input type="text"
class="form-control"
th:field="*{lastName}"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
class="form-control"
th:field="*{email}"
required>

</div>

<div class="mb-3">

<label>Position</label>

<input type="text"
class="form-control"
th:field="*{position}"
required>

</div>

<button type="submit"
class="btn btn-primary">

Save

</button>

<a th:href="@{/employees}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</body>
</html>
